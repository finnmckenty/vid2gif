# Render Blueprint: deploys vid2gif as a static site.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    runtime: static
    name: vid2gif
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
